name: Build and push Docker image to GHCR

on:
  push:
    branches: [main]
  # PRs: build only (no push) + container smoke test (entrypoint, healthcheck, login).
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - name: Brand check
        run: node scripts/brand-check.mjs

  build-and-push:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Secrets come only from .env (env_file); the template must parse cleanly
      # (no stray "$" interpolation warnings) and reach the container env.
      - name: Validate compose files with env_file
        run: |
          set -eu
          cp .env.example .env
          for f in docker-compose.ghcr.yml docker-compose.yml; do
            docker compose -f "$f" config > /tmp/compose.out 2> /tmp/compose.err
            cat /tmp/compose.err
            if grep -qi warn /tmp/compose.err; then echo "warnings in $f"; exit 1; fi
            grep -q 'APP_PASSWORD: СМЕНИТЕ_МЕНЯ' /tmp/compose.out
            # Synology: a custom logging driver empties Container Manager's «Журнал».
            if grep -q '^ *logging:' /tmp/compose.out; then echo "$f must not set logging (Synology db driver)"; exit 1; fi
          done
          rm -f .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image names
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NITRO_PRESET=node-server

      - name: Build (PR, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pora-ci:test
          build-args: |
            NITRO_PRESET=node-server

      - name: Smoke test container (PR)
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          mkdir -p ci-data
          # Same hardening as the compose files.
          docker run -d --name pora-ci -p 127.0.0.1:8080:8080 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add SETUID --cap-add SETGID \
            -e APP_PASSWORD=ci-smoke-password-123 \
            -e APP_URL=http://127.0.0.1:8080 \
            -v "$PWD/ci-data:/data" pora-ci:test
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' pora-ci)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker logs pora-ci
          test "$(docker inspect -f '{{.State.Health.Status}}' pora-ci)" = "healthy"
          uid=$(docker exec pora-ci awk '/^Uid:/{print $2}' /proc/1/status)
          echo "server uid=$uid"
          test "$uid" != "0"
          curl -fsS http://127.0.0.1:8080/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "302"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/sync)" = "401"
          curl -fsS -c jar -H 'content-type: application/json' -H 'origin: http://127.0.0.1:8080' \
            -d '{"password":"ci-smoke-password-123"}' http://127.0.0.1:8080/api/login
          curl -fsS -b jar http://127.0.0.1:8080/api/sync > /dev/null
          # another port on the same host is a different origin
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -H 'origin: http://127.0.0.1:5001' \
            -d '{"password":"ci-smoke-password-123"}' http://127.0.0.1:8080/api/login)" = "403"
          # «выйти везде» invalidates the cookie
          curl -fsS -b jar -X POST -H 'origin: http://127.0.0.1:8080' http://127.0.0.1:8080/api/logout-all > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar http://127.0.0.1:8080/api/sync)" = "401"
          docker exec pora-ci node scripts/restore-backup.mjs --list
          # 1.12: fresh install runs on pora.db; scripts work on it and keep the files owned by the app user
          docker logs pora-ci 2>&1 | grep -q 'storage.ready backend=sqlite'
          docker exec pora-ci node scripts/db-snapshot.mjs
          docker exec pora-ci node scripts/export-json.mjs --to /data/ci-export
          # data/ belongs to the app user (uid 1000, owner-only files): inspect it with sudo
          sudo ls -la ci-data ci-data/backup ci-data/ci-export
          sudo test -f ci-data/pora.db
          test "$(sudo stat -c %a ci-data/pora.db)" = "600"
          sudo test -f ci-data/ci-export/users.json
          sudo sh -c 'ls ci-data/backup/pora-*.db'
          test "$(sudo stat -c %u ci-data/pora.db)" != "0"
          test -z "$(sudo find ci-data -user 0 -print -quit)"
          docker rm -f pora-ci

      - name: Upgrade smoke test (PR) — 1.11 JSON data is imported into pora.db
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          mkdir -p legacy-data
          # A 1.11 data folder: one profile, revision 41, two tasks and a tombstone.
          printf '%s' '{"revision":41,"updatedAt":1760000000000,"data":{"v":1,"lists":[{"id":"l1","name":"Дом","updatedAt":1760000000000}],"tasks":[{"id":"t1","title":"Старое дело","updatedAt":1760000000001,"tags":["дом"],"subtasks":[{"id":"s1","title":"шаг","done":false}]},{"id":"t2","title":"Ещё","updatedAt":1760000000002}],"habits":[],"settings":{"workStart":"09:00","workEnd":"18:00","updatedAt":1},"tombstones":{"tasks":{"gone":1760000000003}}}}' > legacy-data/pora.json
          docker run -d --name pora-ci -p 127.0.0.1:8080:8080 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add SETUID --cap-add SETGID \
            -e APP_PASSWORD=ci-smoke-password-123 \
            -e APP_URL=http://127.0.0.1:8080 \
            -v "$PWD/legacy-data:/data" pora-ci:test
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' pora-ci)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker logs pora-ci
          test "$(docker inspect -f '{{.State.Health.Status}}' pora-ci)" = "healthy"
          docker logs pora-ci 2>&1 | grep -q 'storage.import_ok'
          docker logs pora-ci 2>&1 | grep -q 'storage.ready backend=sqlite'
          sudo test -f legacy-data/pora.db
          sudo test ! -e legacy-data/pora.json
          sudo sh -c 'ls legacy-data/legacy-json-*/pora.json'
          test -z "$(sudo find legacy-data -user 0 -print -quit)"
          curl -fsS -c jar2 -H 'content-type: application/json' -H 'origin: http://127.0.0.1:8080' \
            -d '{"password":"ci-smoke-password-123"}' http://127.0.0.1:8080/api/login
          curl -fsS -b jar2 http://127.0.0.1:8080/api/sync > sync.json
          node -e 'const j=require("./sync.json"); if (j.revision!==41||j.data.tasks.length!==2||j.data.tasks[0].subtasks.length!==1) { console.error(JSON.stringify(j)); process.exit(1) }'
          # restart: no second import
          docker restart pora-ci
          sleep 5
          test "$(docker logs pora-ci 2>&1 | grep -c 'storage.import_ok')" = "1"
          sudo ls -laR legacy-data
