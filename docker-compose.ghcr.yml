# «Пора» — готовый образ из GHCR (сборка на NAS не нужна).
#
# Папка проекта на Synology:
#   /volume1/docker/pora/
#   ├── compose.yaml   ← этот файл (Container Manager → Проект)
#   ├── .env           ← секреты: APP_PASSWORD или APP_PASSWORD_HASH и т.д.
#   └── data/          ← данные: pora.json, backups/, .session-secret
#
# Файл .env ОБЯЗАТЕЛЕН: без него проект не запустится (ошибка
# «Failed to load …/.env» / «env file …/.env not found»).
# Шаблон с пояснениями — .env.example.
# .env никогда не кладётся в git и в образ. Подробно: docs/SYNOLOGY.md.
#
# Образ публичный и не содержит секретов. Обновление по SSH:
#   cd /volume1/docker/pora && sudo docker compose pull && sudo docker compose up -d
# Из клона репозитория:
#   docker compose -f docker-compose.ghcr.yml up -d

services:
  app:
    image: ghcr.io/wladyslawfedotoff-byte/amber-autumn-birch-baker:latest
    container_name: pora-app
    restart: unless-stopped
    init: true
    # Секреты и необязательные настройки — только из .env рядом с этим файлом.
    # Не добавляйте APP_PASSWORD / APP_PASSWORD_HASH / SESSION_SECRET /
    # XAI_API_KEY в environment ниже: environment перекрывает env_file,
    # даже пустым значением.
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "8080"
      # Публичный адрес за Reverse Proxy DSM, С портом (проверка Origin/CSRF).
      APP_URL: "https://pora.fedotovvladislav.synology.me:8443"
      DATA_DIR: /data
      VITE_GROK_EXTENSIONS: "0"
    volumes:
      - ./data:/data
    ports:
      # Только localhost — наружу выходит Reverse Proxy DSM (HTTPS :8443).
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # labels:
    #   autoheal: "true"

  # --- Необязательно: автоперезапуск контейнера в состоянии «unhealthy»
  # (см. docs/SYNOLOGY.md). Нужен /var/run/docker.sock = полный контроль над
  # Docker на NAS; раскомментируйте вместе с labels выше, только если согласны.
  # autoheal:
  #   image: willfarrell/autoheal:latest
  #   container_name: pora-autoheal
  #   restart: unless-stopped
  #   environment:
  #     AUTOHEAL_CONTAINER_LABEL: autoheal
  #     AUTOHEAL_INTERVAL: "60"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
