# Synology Container Manager / Docker Compose for «Пора» — build on the NAS.
# Prefer docker-compose.ghcr.yml (pulls the ready image from GHCR, no build).
#
# The app listens on loopback only — DSM Reverse Proxy (HTTPS :8443) in front.
# Data (tasks, revision, session secret, backups) lives in ./data on the host.
#
# Values come from environment / .env next to this file (compose reads .env
# automatically for ${...}). Never commit .env. See .env.example and
# docs/SYNOLOGY.md.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NITRO_PRESET: node-server
        VITE_AUTH_ENABLED: "false"
    image: pora-app:latest
    container_name: pora-app
    restart: unless-stopped
    init: true
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "8080"
      # Public URL behind the reverse proxy (WITH the port), used for the
      # login CSRF/origin check.
      APP_URL: "${APP_URL:-https://pora.fedotovvladislav.synology.me:8443}"
      # Login password (min 8 chars). Or set APP_PASSWORD_HASH instead
      # (node scripts/hash-password.mjs). The app refuses to start serving
      # until one of them is set.
      APP_PASSWORD: "${APP_PASSWORD:-}"
      APP_PASSWORD_HASH: "${APP_PASSWORD_HASH:-}"
      # Optional: if empty, generated once into /data/.session-secret (0600).
      SESSION_SECRET: "${SESSION_SECRET:-}"
      DATA_DIR: /data
      VITE_GROK_EXTENSIONS: "0"
      # Optional: run as the owner of ./data (DSM user, e.g. 1026 / 100).
      PUID: "${PUID:-}"
      PGID: "${PGID:-}"
      # Optional, not needed for «Пора» today.
      DATABASE_URL: "${DATABASE_URL:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
    volumes:
      - ./data:/data
    ports:
      # Only localhost — the DSM Reverse Proxy reaches this.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # labels:
    #   autoheal: "true"

  # --- Optional: restart the container automatically when it is "unhealthy".
  # `restart: unless-stopped` already restarts it after a crash (the server
  # exits on fatal errors). autoheal also covers a hung-but-running process.
  # NOTE: autoheal needs /var/run/docker.sock (= full control over Docker on
  # the NAS). Enable only if you accept that; then uncomment the labels above.
  # autoheal:
  #   image: willfarrell/autoheal:latest
  #   container_name: pora-autoheal
  #   restart: unless-stopped
  #   environment:
  #     AUTOHEAL_CONTAINER_LABEL: autoheal
  #     AUTOHEAL_INTERVAL: "60"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
