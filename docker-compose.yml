# Synology Container Manager / Docker Compose for «Пора».
# App listens on loopback only — put DSM Reverse Proxy in front (HTTPS).
#
# Default: app only. Tasks live in the browser (localStorage) with optional
# WebDAV / folder sync from Settings — Postgres is NOT required.
#
# Optional Postgres: uncomment the db service and set DATABASE_URL in .env
# (needed only if you later enable auth / server migrations).
#
# Optional GHCR pull (no build on NAS): use docker-compose.ghcr.yml instead,
# or comment out `build:` below and uncomment `image:`.
#   image: ghcr.io/wladyslawfedotoff-byte/amber-autumn-birch-baker:latest

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NITRO_PRESET: node-server
        VITE_AUTH_ENABLED: "false"
    image: pora-app:latest
    # Pull from private GHCR instead of building (requires docker login ghcr.io):
    # image: ghcr.io/wladyslawfedotoff-byte/amber-autumn-birch-baker:latest
    container_name: pora-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "${PORT:-8080}"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "${PORT:-8080}"
      # Public URL behind reverse proxy (auth cookies / redirects if auth enabled).
      APP_URL: "${APP_URL:-}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-${APP_URL:-}}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
    ports:
      # Only localhost — DSM Reverse Proxy / nginx on the NAS reaches this.
      - "127.0.0.1:${PORT:-8080}:8080"
    # Optional: attach to postgres network when db service is enabled
    # depends_on:
    #   db:
    #     condition: service_healthy
    # networks:
    #   - pora-net

